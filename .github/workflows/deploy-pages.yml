name: Deploy Pages

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: '0 20 3-12 9 *'
  workflow_dispatch:
    inputs:
      daily_date:
        description: 'Fecha a regenerar (opcional; se publican también las demás fechas)'
        required: false
        type: string

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publication-window:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - name: Check 2026 publication window
        id: window
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_date="$(date -u +%F)"
          if [[ "$current_date" > "2026-09-02" && "$current_date" < "2026-09-13" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: publication-window
    if: needs.publication-window.outputs.run == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Generate daily popular Stories and posts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DAILY_POPULAR_DATE: ${{ inputs.daily_date }}
        run: |
          if [ -n "$DAILY_POPULAR_DATE" ]; then
            npm run social:daily -- --date "$DAILY_POPULAR_DATE" --all
          else
            npm run social:daily -- --all
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
