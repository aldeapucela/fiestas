<!doctype html>
<html lang="es">
  <head>

      main { width: min(100%, 28rem); padding: 2rem; border: 1px solid #e4dfe9; border-radius: 1.5rem; background: #fff; box-shadow: 0 1.2rem 3rem rgba(56, 42, 71, .12); text-align: center; }

      h1 { margin: 0 0 .7rem; font-size: 1.6rem; }
      p { margin: 0; color: #667085; line-height: 1.6; }
      a { display: inline-flex; margin-top: 1.5rem; padding: .75rem 1rem; border-radius: 999px; background: #0f9f8d; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/icons/fiestas-192.png" alt="" />
      <h1>Estás sin conexión</h1>
      <p>Cuando vuelva la conexión podrás consultar la agenda completa. Las páginas que ya hayas visitado pueden seguir disponibles.</p>
      <a href="/">Volver a Fiestas Valladolid</a>
